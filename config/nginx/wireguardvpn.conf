#
# WireGuardVPN - Ecuavisa UIO
#
# HTTPS frontend:
#   https://vpn.uio.ecuavisa.com
#
# Backend:
#   http://127.0.0.1:8095
#

server {
    listen 80;
    listen [::]:80;

    server_name vpn.uio.ecuavisa.com;

    return 301 https://$host$request_uri;
}


server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name vpn.uio.ecuavisa.com;

    ssl_certificate
        /etc/nginx/ssl/wireguardvpn/vpn.uio.ecuavisa.com.crt;

    ssl_certificate_key
        /etc/nginx/ssl/wireguardvpn/vpn.uio.ecuavisa.com.key;

    ssl_protocols TLSv1.2 TLSv1.3;

    ssl_session_cache shared:WGVPN_SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    #
    # Dashboard administrativo
    #
    auth_basic "WireGuardVPN - Ecuavisa UIO";
    auth_basic_user_file
        /etc/nginx/.htpasswd-wireguardvpn;

    #
    # Acceso solamente desde redes internas/VPN.
    #
    allow 10.8.0.0/24;
    allow 192.168.2.0/24;
    allow 192.168.6.0/24;
    allow 192.168.28.0/24;
    deny all;

    client_max_body_size 1m;

    location ^~ /static/ {
        proxy_pass http://127.0.0.1:8095;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;

        expires 1d;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8095;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For
            $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;

        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        proxy_redirect off;
    }
}
