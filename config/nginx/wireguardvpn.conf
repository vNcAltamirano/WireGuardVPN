
#
# WireGuardVPN security controls
#

limit_req_zone $binary_remote_addr
    zone=wgvpn_general:10m
    rate=30r/m;

map "$request_method:$http_origin" $wgvpn_csrf_ok {
    default 0;

    ~^(GET|HEAD|OPTIONS): 1;

    "POST:https://vpn.uio.ecuavisa.com" 1;
    "POST:https://vpn.uio.ecuavisa.com:9444" 1;

    "POST:https://192.168.2.168" 1;
    "POST:https://192.168.2.168:9444" 1;
}

#
# WireGuardVPN - Ecuavisa UIO
#
# HTTPS frontend:
#   https://vpn.uio.ecuavisa.com
#
# Backend:
#   http://127.0.0.1:8095
#

server {
    listen 80;
    listen [::]:80;

    server_name vpn.uio.ecuavisa.com;

    return 301 https://$host$request_uri;
}


server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    # Acceso administrativo temporal sin depender de DNS.
    # https://192.168.2.168:9444
    listen 9444 ssl http2;
    listen [::]:9444 ssl http2;

    server_name vpn.uio.ecuavisa.com;

    ssl_certificate
        /etc/nginx/ssl/wireguardvpn/vpn.uio.ecuavisa.com.crt;

    ssl_certificate_key
        /etc/nginx/ssl/wireguardvpn/vpn.uio.ecuavisa.com.key;

    ssl_protocols TLSv1.2 TLSv1.3;

    server_tokens off;

    auth_delay 500ms;

    limit_req zone=wgvpn_general burst=30 nodelay;

    if ($wgvpn_csrf_ok = 0) {
        return 403;
    }

    add_header X-Content-Type-Options
        "nosniff" always;

    add_header X-Frame-Options
        "DENY" always;

    add_header Referrer-Policy
        "no-referrer" always;

    add_header Permissions-Policy
        "camera=(), microphone=(), geolocation=()" always;

    add_header Content-Security-Policy
        "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

    ssl_session_cache shared:WGVPN_SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    #
    # Dashboard administrativo
    #
    auth_basic "WireGuardVPN - Ecuavisa UIO";
    auth_basic_user_file
        /etc/nginx/auth/wireguardvpn.htpasswd;

    #
    # Acceso solamente desde redes internas/VPN.
    #
    allow 10.8.0.0/24;
    allow 192.168.2.0/24;
    allow 192.168.6.0/24;
    allow 192.168.28.0/24;
    deny all;

    client_max_body_size 1m;

    location ^~ /static/ {
        proxy_pass http://127.0.0.1:8095;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;

        expires 1d;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8095;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For
            $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;

        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        proxy_redirect off;
    }
}
